[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h3-turing"
version = "0.1.0"
description = "Field-tested toolkit for running MiniMax H3 on Turing (sm_75) GPUs via ComfyUI - tier presets, API client, benchmark harness"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "IvenKooLab" }]
keywords = ["comfyui", "minimax-h3", "video-generation", "turing", "w4a8", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = []

[project.scripts]
h3turing = "h3turing.cli:main"

[project.urls]
Handbook = "https://github.com/IvenKooLab/minimax-h3-turing"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
h3turing = ["data/*.json"]
