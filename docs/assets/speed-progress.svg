<text x="396" y="402" font-size="11.5" fill="#9ca3af" text-anchor="middle">1</text>
<line x1="492" y1="112" x2="492" y2="384" stroke="#e5e7eb" stroke-width="1"/>
<text x="492" y="402" font-size="11.5" fill="#9ca3af" text-anchor="middle">2</text>
<line x1="588" y1="112" x2="588" y2="384" stroke="#e5e7eb" stroke-width="1"/>
<text x="588" y="402" font-size="11.5" fill="#9ca3af" text-anchor="middle">3</text>
<line x1="685" y1="112" x2="685" y2="384" stroke="#e5e7eb" stroke-width="1"/>
<text x="685" y="402" font-size="11.5" fill="#9ca3af" text-anchor="middle">4</text>
<line x1="781" y1="112" x2="781" y2="384" stroke="#e5e7eb" stroke-width="1"/>
<text x="781" y="402" font-size="11.5" fill="#9ca3af" text-anchor="middle">5</text>
<text x="794" y="402" font-size="11.5" fill="#9ca3af">分钟/镜</text>
<text x="286" y="147" font-size="13.5" fill="#374151" text-anchor="end" font-weight="600">官方教程路线（参照）</text>
<rect x="300" y="124" width="444" height="36" rx="6" fill="#6b7280"/>
<text x="312" y="146" font-size="12" font-weight="600" fill="#fff">未吃到 cu130 反量化红利</text>
<path d="M750 120 l14 44 M762 120 l14 44" stroke="#9ca3af" stroke-width="2" fill="none"/>
<rect x="782" y="124" width="18" height="36" rx="6" fill="#6b7280" opacity="0.45"/>
<text x="814" y="147" font-size="15" font-weight="700" fill="#4b5563">20–30 分钟</text>
<text x="286" y="203" font-size="13.5" fill="#374151" text-anchor="end" font-weight="600">不加 T8（成片标准）</text>
<rect x="300" y="180" width="452" height="36" rx="6" fill="#2563eb"/>
<text x="312" y="202" font-size="12" font-weight="600" fill="#fff">✓ 可复现</text>
<text x="764" y="203" font-size="15" font-weight="700" fill="#111827">4.7 分钟</text>
<text x="764" y="218" font-size="11.5" fill="#9ca3af">280 s</text>
<text x="286" y="259" font-size="13.5" fill="#374151" text-anchor="end" font-weight="600">T8 · 默认参数</text>
<rect x="300" y="236" width="462" height="36" rx="6" fill="#dc2626"/>
<text x="312" y="258" font-size="12" font-weight="600" fill="#fff">0 次命中</text>
<text x="774" y="259" font-size="15" font-weight="700" fill="#111827">4.8 分钟</text>
<text x="774" y="274" font-size="11.5" fill="#9ca3af">290 s</text>
<text x="852" y="259" font-size="14.5" font-weight="700" fill="#dc2626">+4% 更慢</text>
<text x="286" y="315" font-size="13.5" fill="#374151" text-anchor="end" font-weight="600">T8 · 阈值 0.45</text>
<rect x="300" y="292" width="356" height="36" rx="6" fill="#60a5fa"/>
<text x="312" y="314" font-size="12" font-weight="600" fill="#fff">命中 1/4 步</text>
<text x="668" y="315" font-size="15" font-weight="700" fill="#111827">3.7 分钟</text>
<text x="668" y="330" font-size="11.5" fill="#9ca3af">220 s</text>
<text x="746" y="315" font-size="14.5" font-weight="700" fill="#059669">−21%</text>
<text x="286" y="371" font-size="13.5" fill="#374151" text-anchor="end" font-weight="600">T8 · 阈值 1.0（激进）</text>
<rect x="300" y="348" width="260" height="36" rx="6" fill="#059669"/>
<text x="312" y="370" font-size="12" font-weight="600" fill="#fff">仅草稿 · 不可复现</text>
