<text x="30" y="404" font-size="11.5" fill="#9ca3af">同晚同 seed 热跑实测（2026-09-01）；T8 = MiniMax 官方 BlockCache 缓存节点，默认参数在 4 步路线上不生效。</text>
<text x="30" y="422" font-size="11.5" fill="#9ca3af">激进档提速的代价：同 seed 不可复现 → 只用于草稿/选镜头，成片请用无 T8 基线。详见 docs/08。</text>
