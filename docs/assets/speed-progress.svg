<text x="572" y="386" font-size="11.5" fill="#9ca3af">160 s</text>
<text x="650" y="371" font-size="14.5" font-weight="700" fill="#059669">−43%</text>
<text x="30" y="430" font-size="11.5" fill="#9ca3af">同晚同 seed 热跑实测（2026-09-01）；T8 = MiniMax 官方 BlockCache 缓存节点，默认参数在 4 步路线上不生效。</text>
<text x="30" y="448" font-size="11.5" fill="#9ca3af">本机各档比官方教程参照快 5–11 倍。激进档提速的代价：同 seed 不可复现 → 只用于草稿/选镜头，成片请用无 T8 基线。详见 docs/08。</text>
</svg>